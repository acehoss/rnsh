name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'README.md'
      - '.github/**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - 'main'
    paths-ignore:
      - 'README.md'

jobs:

  test:
    runs-on: [self-hosted, linux]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
          clean: true
          ref: ${{ github.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Poetry Action
        uses: snok/install-poetry@v1.3.3
   

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        id: cache
        with:
          path: ~/.virtualenvs
          # poetry.lock is gitignored, so key on pyproject.toml and the Python version.
          key: poetry-py3.11-${{ hashFiles('pyproject.toml') }}

      # Always install: the cache only warms the virtualenv, it is not authoritative.
      - name: Install Dependencies
        run: poetry install

#      - name: Code Quality
#        run: poetry run black . --check

      - name: Test with pytest
        run: poetry run pytest -q
